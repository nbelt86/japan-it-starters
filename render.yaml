services:
  - type: web
    name: japan-it-starters
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: japan-it-starters-db
          property: connectionString

databases:
  - name: japan-it-starters-db
    plan: free
